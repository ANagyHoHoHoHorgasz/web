<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="index.js"></script>
    <title>Számológép</title>
</head>
<body>
    <main>
        <h1>Számológép</h1>
        <h1 id="kiirato"></h1>
        <div id="gombok">
            <button class="szam" id="nulla"><p>0</p></button>
            <button class="szam" id="egy"><p>1</p></button>
            <button class="szam" id="ketto"><p>2</p></button>
            <button class="szam" id="harom"><p>3</p></button>
            <button class="fos" id="osszeadas"><p>+</p></button>
            
            <button class="szam" id="negy"><p>4</p></button>
            <button class="szam" id="ot"><p>5</p></button>
            <button class="szam" id="hat"><p>6</p></button>
            <button class="fos" id="kivonas"><p>-</p></button>

            <button class="szam" id="het"><p>7</p></button>
            <button class="szam" id="nyolc"><p>8</p></button>
            <button class="szam" id="kilenc"><p>9</p></button>
            <button class="fos" id="szorzas"><p>*</p></button>

            <button class="fos" id="torles"><p>C</p></button>
            <button class="fos" id="egyenlo"><p>=</p></button>
            <button class="fos" id="osztas"><p>/</p></button>
        </div>
    </main>
</body>
</html>
